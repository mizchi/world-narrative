<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>灰潮の入り江 — シーン画集</title><style>
:root{color-scheme:dark;--bg:#16201b;--paper:#202b24;--line:#414c40;--ink:#eee8db;--muted:#bcb8aa;--accent:#c9bf9c}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.8 "Hiragino Mincho ProN","Yu Mincho",serif}main{max-width:1500px;margin:auto;padding:40px 28px 60px}header{max-width:880px;margin-bottom:36px}small,.stage{color:var(--accent)}h1{font-weight:500;letter-spacing:.1em;font-size:clamp(28px,4vw,44px);margin:8px 0}h2{font-weight:500;font-size:24px;border-top:1px solid var(--line);padding-top:24px}h3{font-weight:500;font-size:19px;margin:3px 0}p{color:var(--muted);margin:8px 0}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:24px}figure{margin:0;background:var(--paper);border:1px solid var(--line)}img{display:block;width:100%;aspect-ratio:16/9;object-fit:contain;background:#d8d3c7}figcaption{padding:18px 22px}.stage{font:12px/1.8 system-ui,sans-serif;letter-spacing:.12em}figcaption p{font-size:14px}a{color:var(--accent)}.full,nav{font:13px/1.8 system-ui,sans-serif}nav{display:flex;gap:20px;flex-wrap:wrap;margin-top:16px}footer{border-top:1px solid var(--line);margin-top:40px;padding-top:20px;color:var(--muted);font-size:13px}@media(max-width:800px){main{padding:24px 16px}.grid{grid-template-columns:1fr}}
</style></head><body><main><header><small>シーン画集 · 11枚 · Bを共通参照</small><h1>灰潮の入り江</h1><p>細いペンの線と淡彩。白い石、灰色の水、曇天の光を、港から南の水門と北の採石場まで引き継ぎました。</p><p>制作確認用の一覧です。到着・調査・介入後の場面を含みます。画像を選ぶと原寸で開けます。</p><nav><a href="character-gallery.html">人物画集</a><a href="style-b-ink-wash-v1.png">採用したBの画像</a><a href="art-direction.json">描画方針・共通プロンプト</a><a href="scene-plan.json">シーンと表示条件</a></nav></header><section><h2>港</h2><div class="grid"><figure><a href="scenes/harbor-arrival-v1.png"><img src="scenes/harbor-arrival-v1.png" alt="入り江の港" loading="eager"></a><figcaption><span class="stage">到着</span><h3>入り江の港</h3><p>港の倉と船着場、配分用の道具。日常の仕事と白い入り江の全景。袋の印を数量保証として描かない。</p><a class="full" href="scenes/harbor-arrival-v1.png">原寸を開く ↗</a></figcaption></figure></div></section>
<section><h2>南の水門</h2><div class="grid"><figure><a href="style-b-ink-wash-v1.png"><img src="style-b-ink-wash-v1.png" alt="南の古い水門" loading="eager"></a><figcaption><span class="stage">到着</span><h3>南の古い水門</h3><p>未修理の白い道、水門、雨水槽、金属の干し枠と網。今回の画風比較に使う到着場面。</p><a class="full" href="style-b-ink-wash-v1.png">原寸を開く ↗</a></figcaption></figure>
<figure><a href="scenes/tide-inspection-v1.png"><img src="scenes/tide-inspection-v1.png" alt="道の下の分岐" loading="eager"></a><figcaption><span class="stage">調査・発見</span><h3>道の下の分岐</h3><p>灯りと点検縄で旧溝を調べ、白い沈着の筋と分岐板を観察する。流れの偏りを示し、粉の効力の秘密を図解しない。</p><a class="full" href="scenes/tide-inspection-v1.png">原寸を開く ↗</a></figcaption></figure>
<figure><a href="scenes/tide-trial-v1.png"><img src="scenes/tide-trial-v1.png" alt="同量の砂で試す" loading="eager"></a><figcaption><span class="stage">調査・発見</span><h3>同量の砂で試す</h3><p>淡水・目印の砂・回収袋・帳面を照合する作業。砂を魔法の防護剤として光らせず、記憶を石から読み出す絵にしない。</p><a class="full" href="scenes/tide-trial-v1.png">原寸を開く ↗</a></figcaption></figure>
<figure><a href="scenes/tide-repaired-v2.png"><img src="scenes/tide-repaired-v2.png" alt="剝がした道" loading="eager"></a><figcaption><span class="stage">介入後</span><h3>剝がした道</h3><p>剝いだ敷石と塞いだ旧溝。通れなくなった道の手前に荷車が止まり、運ぶ仕事の負担が残る。修理だけで両方を保護した結果にしない。</p><a class="full" href="scenes/tide-repaired-v2.png">原寸を開く ↗</a></figcaption></figure></div></section>
<section><h2>北の採石場</h2><div class="grid"><figure><a href="scenes/quarry-arrival-v1.png"><img src="scenes/quarry-arrival-v1.png" alt="北の採石場" loading="eager"></a><figcaption><span class="stage">到着</span><h3>北の採石場</h3><p>美しい白い階段と、その裏の窯台の支柱、粉を運ぶ溝。誇りと日々の補修の両方を読める景観。</p><a class="full" href="scenes/quarry-arrival-v1.png">原寸を開く ↗</a></figcaption></figure>
<figure><a href="scenes/quarry-ledger-v1.png"><img src="scenes/quarry-ledger-v1.png" alt="夜勤帳" loading="eager"></a><figcaption><span class="stage">調査・発見</span><h3>夜勤帳</h3><p>作業者の膝に残した帳面、支柱点検の道具。本文はUIで出すので、画像中に読める契約文・固有名詞を描かない。</p><a class="full" href="scenes/quarry-ledger-v1.png">原寸を開く ↗</a></figcaption></figure>
<figure><a href="scenes/quarry-channel-v1.png"><img src="scenes/quarry-channel-v1.png" alt="届かない色水" loading="eager"></a><figcaption><span class="stage">調査・発見</span><h3>届かない色水</h3><p>三枚の蓋を開けた溝、捨て口へ流れる色水、洗い場の白い溜まり。色水は普通の流路の目印。</p><a class="full" href="scenes/quarry-channel-v1.png">原寸を開く ↗</a></figcaption></figure>
<figure><a href="scenes/quarry-trial-v1.png"><img src="scenes/quarry-trial-v1.png" alt="供述票と試験石板" loading="eager"></a><figcaption><span class="stage">調査・発見</span><h3>供述票と試験石板</h3><p>開いた旧作業箱、供述票、流量表、侵食の境界が残る試験石板。供述票は紙の資料であり石に閉じ込めた記憶ではない。文字は判読できない筆跡に留める。</p><a class="full" href="scenes/quarry-trial-v1.png">原寸を開く ↗</a></figcaption></figure>
<figure><a href="scenes/quarry-kiln-repaired-v1.png"><img src="scenes/quarry-kiln-repaired-v1.png" alt="窯台を直したあと" loading="eager"></a><figcaption><span class="stage">介入後</span><h3>窯台を直したあと</h3><p>抜いた木の支柱と座り直した窯台。窯を止めた作業後で、階段と溝は未修理。万能な再建の全景にしない。</p><a class="full" href="scenes/quarry-kiln-repaired-v1.png">原寸を開く ↗</a></figcaption></figure>
<figure><a href="scenes/quarry-channel-repaired-v1.png"><img src="scenes/quarry-channel-repaired-v1.png" alt="粉の溝を直したあと" loading="eager"></a><figcaption><span class="stage">介入後</span><h3>粉の溝を直したあと</h3><p>小水門へ届く掘り直した溝、休業中の洗い場、上の井戸へ桶を運ぶ人。窯台と石段は未修理。</p><a class="full" href="scenes/quarry-channel-repaired-v1.png">原寸を開く ↗</a></figcaption></figure></div></section><footer>帳面の筆跡や数量は装飾として描いています。物語の情報は本文で提示します。人物の外見と建物の細部はイメージ図としての解釈です。<nav><a href="comparison.html">初期の画風比較</a><a href="scene-generation-manifest.json">生成履歴・参照画像・保存先</a></nav></footer></main></body></html>
