<title>灰潮の入り江 — 画風の比較</title>

:root{color-scheme:dark}body{max-width:1800px;margin:auto;padding:32px;background:#18201c;color:#eee7dc;font:16px/1.8 system-ui,sans-serif}h1{font-size:25px;font-weight:500}p{color:#c3bdaf}main{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px}figure{margin:0}img{width:100%;display:block}figcaption{margin-top:14px}a{color:inherit}small{color:#c3bdaf}@media(max-width:1100px){main{grid-template-columns:1fr}}

<h1>灰潮の入り江：南の水門の画風比較</h1>
<p>共通の場面、白い石と灰色の水、曇天の光。2案目のBを採用しました。画像を開くと原寸で比較できます。</p>
<main>
<figure><a href="style-a-painterly-v1.png"><img src="style-a-painterly-v1.png" alt="A、白い敷石の道と水門を油彩風に描いた風景"></a><figcaption>A — 油彩風の環境画<br><small>石と水の質感、空間の奥行き。</small></figcaption></figure>
<figure><a href="style-b-ink-wash-v1.png"><img src="style-b-ink-wash-v1.png" alt="B、水門と干し網を細い線と淡彩で描いた風景"></a><figcaption>B — ペン画と淡彩<br><small>現物を観察する線、紙の上の記録の感触。</small></figcaption></figure>
<figure><a href="style-c-gouache-v1.png"><img src="style-c-gouache-v1.png" alt="C、水門と入り江を大きな色面で描いた風景"></a><figcaption>C — 平面的なガッシュを目指した案<br><small>形と色面の整理。生成結果には写実的な細部も残る。</small></figcaption></figure>
</main>
<p>Bを後続シーンの共通参照として使用します。人物の外見と建物配置は、まだ正史の設定ではありません。</p>
