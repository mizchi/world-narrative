</style></head><body><main><header><small>人物画集 · 5人 · ペン画と淡彩</small><h1>灰潮の入り江の人々</h1><p>白い石と灰色の水のそばで働く5人。シーン画の筆致と配色を引き継ぎ、顔、服の形、手に持つ道具を描き分けました。</p><p>人物デザインの初稿です。各画像を今後の場面で参照し、同じ人物の外見をそろえるために使います。画像を選ぶと原寸で開けます。</p><nav><a href="gallery.html">シーン画集</a><a href="style-b-ink-wash-v1.png">画風の基準B</a><a href="character-art-direction.json">人物の描画方針</a></nav></header>
<section class="grid" aria-label="登場人物の全身像">
<figure><a href="characters/ira-v1.png"><img src="characters/ira-v1.png" alt="鐘守イラ。青灰色の長い上着と閉じた配分帳を持つ全身像" loading="eager"></a><figcaption><span class="place">入り江の港</span><h2>鐘守イラ</h2><p>港で粉の配分を担う。全員の暮らしを守りたい思いと、限られた手段の間に立つ。</p><p class="design">青灰色の膝丈の上着、顎までの黒い髪、閉じた配分帳と小さな鍵束。</p><a class="full" href="characters/ira-v1.png">原寸を開く ↗</a></figcaption></figure>
<figure><a href="characters/sui-v1.png"><img src="characters/sui-v1.png" alt="水門修理人スイ。短い青緑の作業上着と点検縄を持つ全身像" loading="eager"></a><figcaption><span class="place">南の古い水門</span><h2>水門修理人スイ</h2><p>低庭の雨水槽を残したい。水門や道の下を調べ、暮らしを支える設備に手を入れる。</p><p class="design">短い波打つ髪、袖をまくった作業着、黄土色の膝の補修布と点検縄。</p><a class="full" href="characters/sui-v1.png">原寸を開く ↗</a></figcaption></figure>
<figure><a href="characters/asa-v1.png"><img src="characters/asa-v1.png" alt="網職人アサ。灰青の肩布をまとい、畳んだ漁網と木の網針を持つ全身像" loading="eager"></a><figcaption><span class="place">南の網の干し場</span><h2>網職人アサ</h2><p>次の漁へ向けて網を仕上げる。白い道は、美しい眺めであると同時に荷車を通す場所でもある。</p><p class="design">灰色混じりの一本の三つ編み、灰青の肩布、畳んだ網と木の網針。</p><a class="full" href="characters/asa-v1.png">原寸を開く ↗</a></figcaption></figure>
<figure><a href="characters/nene-v1.png"><img src="characters/nene-v1.png" alt="窯番ネネ。褪せた赤茶の革前掛けと作業手袋を持つ全身像" loading="eager"></a><figcaption><span class="place">北の採石場の窯</span><h2>窯番ネネ</h2><p>今便の納品を急ぐ窯番。窯の仕事を続ける判断と、自分の大切な記憶を差し出す判断を抱える。</p><p class="design">まとめた濃い髪と錆色の頭布、長い革前掛け、折り畳んだ手袋と火ばさみ。</p><a class="full" href="characters/nene-v1.png">原寸を開く ↗</a></figcaption></figure>
<figure><a href="characters/ado-v1.png"><img src="characters/ado-v1.png" alt="階段職人アド。石灰色の上着をまとい、工具布と木槌を携えた全身像" loading="eager"></a><figcaption><span class="place">北の白い石段</span><h2>階段職人アド</h2><p>石段の修繕仕事が減り、窯の夜勤で支柱を点検している。仕事への誇りが、疲れた足取りにも残る。</p><p class="design">短い白髪と灰色の髭、石灰色の腰丈の上着、工具布と小さな木槌。</p><a class="full" href="characters/ado-v1.png">原寸を開く ↗</a></figcaption></figure>
</section><footer>本文にない年齢・髪型・服装は、この初稿の視覚デザインとして記録しました。既存シーンの小さな作業者は匿名のままです。<nav><a href="character-prompts-v1.json">生成プロンプト</a><a href="character-generation-manifest.json">画像と参照の生成履歴</a><a href="README.md">制作資料</a></nav></footer></main></body></html>
